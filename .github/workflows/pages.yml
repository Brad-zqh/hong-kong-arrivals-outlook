name: Publish arrivals rehearsal

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine refresh window
        id: window
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          today="$(TZ=Asia/Hong_Kong date +%Y%m%d)"
          if [[ "$TRIGGER" != schedule || "$today" -le 20270430 ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh public source status
        if: steps.window.outputs.publish == 'true'
        run: python -B refresh_sources.py
      - name: Configure Pages
        if: steps.window.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static website
        if: steps.window.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        if: steps.window.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
